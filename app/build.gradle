plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Create a variable called keystorePropertiesFile, and initialize it to your
// keystore.properties file, in the rootProject folder.
def keystorePropertiesFile = rootProject.file("keystore.properties")

// Initialize a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Load your keystore.properties file into the keystoreProperties object.
if (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace 'xtr.keymapper'
    compileSdk 37

    defaultConfig {
        applicationId "xtr.keymapper"
        minSdk 25
        targetSdk 34
        versionCode 24
        versionName '2.5.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern ''
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    testOptions { unitTests.includeAndroidResources = true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true	

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            resValue("string", "app_name", "XtMapper(Debug)")
        }

    }

    externalNativeBuild {
        ndkBuild {
            path 'Android.mk'
        }
    }

/*
    applicationVariants.configureEach {
        it.outputs.every {
            it.outputFileName = "XtMapper-${it.name}-v${defaultConfig.versionName}.apk"
        }
    }
*/

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
        compose true
    }
    packagingOptions.jniLibs.useLegacyPackaging true

    ndkVersion '28.0.13004108'
    
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.compose.material3:material3-window-size-class:1.4.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation("com.google.android.material:material:1.14.0")
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation "com.github.topjohnwu.libsu:core:5.3.0"
    implementation "com.github.topjohnwu.libsu:service:5.3.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    testImplementation composeBom
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Material Design 3
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended-android:1.7.8'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    compileOnly project(path: ':app:hidden-api')

}

// Development inventory: resolved runtime components only, no signing configuration output.
tasks.register('dependencyInventory') {
    doLast {
        def components = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { a ->
            def id = a.moduleVersion.id
            [group:id.group, name:id.name, version:id.version]
        }.unique().sort { a,b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
        def root = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
        def bomComponents = components.collect { c ->
            def poms = fileTree(new File(root,"${c.group}/${c.name}/${c.version}")).matching { include '**/*.pom' }.files
            def licenses = []
            poms.each { pom ->
                def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl',true)
                factory.setFeature('http://xml.org/sax/features/external-general-entities',false)
                factory.setFeature('http://xml.org/sax/features/external-parameter-entities',false)
                def xml = factory.newDocumentBuilder().parse(pom)
                def nodes = xml.getElementsByTagName('license')
                for(int i=0;i<nodes.length;i++) {
                    def names=nodes.item(i).getElementsByTagName('name')
                    if(names.length>0) licenses.add([license:[name:names.item(0).textContent.take(200)]])
                }
            }
            [type:'library', group:c.group, name:c.name, version:c.version,
             purl:"pkg:maven/${c.group}/${c.name}@${c.version}", licenses:licenses.unique()]
        }
        def destination = layout.buildDirectory.dir('reports/dependencies').get().asFile
        destination.mkdirs()
        new File(destination,'inventory.json').text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(components))
        def bom=[bomFormat:'CycloneDX', specVersion:'1.6', version:1, components:bomComponents]
        new File(destination,'sbom.json').text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bom))
        new File(destination,'licenses.json').text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bomComponents.collect { [module:it.purl,licenses:it.licenses,status:it.licenses ? 'RECORDED' : 'UNRESOLVED'] }))
    }
}
